<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akbar & Sons Sanitary Store — POS</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f1e8;--surface:#fff;--surface2:#f0ece1;--border:#e0dace;--accent:#e08a2e;--accent2:#c4731e;--green:#2e8b57;--red:#d64545;--yellow:#c4731e;--text:#1c2230;--muted:#7a7567;--navy:#1c2230;--navy2:#2a3142;--radius:10px;--blue:#2f6fb5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Roboto',system-ui,sans-serif;font-size:14px;overflow:hidden;display:flex;flex-direction:column}
button{font-family:inherit}
.hidden{display:none!important}

/* top bar */
.topbar{background:var(--navy);border-bottom:2px solid var(--accent);padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:10px}
.logo{font-size:1.1rem;font-weight:800;color:var(--accent);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo span{color:#f5f1e8}
.hamb{display:none;background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer}
.topbar-right{display:flex;align-items:center;gap:12px;font-family:'Roboto Mono',monospace;font-size:.76rem;color:#b8bdc9;white-space:nowrap}
.topbar-right .clk{color:var(--accent)}
.user-chip{background:var(--navy2);border-radius:20px;padding:4px 12px;font-family:'Roboto',sans-serif;font-weight:600;color:#fff;font-size:.78rem}
.user-chip small{color:var(--accent);font-weight:500;margin-left:4px;text-transform:uppercase;font-size:.62rem}
.top-btn{background:transparent;border:1px solid #4a5268;color:#d5d9e3;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.74rem;font-family:'Roboto',sans-serif}
.top-btn:hover{border-color:var(--accent);color:#fff}
.bk-dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block}
.bk-dot.warn{background:var(--red)}

/* layout */
.app{display:flex;flex:1;overflow:hidden}
.sidebar{width:190px;background:var(--navy);flex-shrink:0;display:flex;flex-direction:column;padding:10px 8px;gap:3px;overflow-y:auto}
.side-item{display:flex;align-items:center;gap:10px;background:transparent;border:none;color:#b8bdc9;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:.84rem;font-weight:600;text-align:left}
.side-item:hover{background:var(--navy2);color:#fff}
.side-item.active{background:var(--accent);color:#fff}
.si-ic{font-size:1.05rem;width:22px;text-align:center}
.si-lb{flex:1}
.si-badge{background:var(--red);color:#fff;border-radius:10px;font-size:.62rem;padding:1px 6px;font-weight:700}
.si-badge:empty{display:none}
.page-root{flex:1;overflow:auto;position:relative}
.pg{padding:16px 18px;min-height:100%}
.pg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.page-title{font-size:1.15rem;font-weight:800}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:2px solid var(--border)}
.tab{padding:8px 14px;border:none;background:none;cursor:pointer;font-weight:600;font-size:.82rem;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--accent2);border-bottom-color:var(--accent)}
.tab:hover:not(.active){color:var(--text)}

/* buttons */
.btn-primary{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:.82rem}
.btn-primary:hover{background:var(--accent2)}
.btn{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:7px 13px;font-weight:600;cursor:pointer;font-size:.8rem}
.btn:hover{border-color:var(--accent);color:var(--accent2)}
.btn.sm{padding:3px 9px;font-size:.72rem}
.btn.red{color:var(--red)}.btn.red:hover{border-color:var(--red);color:var(--red)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn:disabled,.btn-primary:disabled{opacity:.5;cursor:not-allowed}

/* inputs */
.select-input,.form-input,.search-box{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-family:inherit;font-size:.84rem;outline:none;min-width:0}
.form-input{width:100%}
.select-input:focus,.form-input:focus,.search-box:focus{border-color:var(--accent)}
.search-wrap{position:relative;display:flex;align-items:center;flex:1;min-width:140px}
.search-box{width:100%;padding-right:32px;font-family:'Roboto Mono',monospace;font-size:.82rem}
.search-clear{display:none;position:absolute;right:6px;width:22px;height:22px;border:none;border-radius:50%;background:var(--border);color:var(--text);cursor:pointer;font-size:.7rem}
.search-clear:hover{background:var(--red);color:#fff}.search-clear.show{display:block}
.form-group{margin-bottom:11px;flex:1}
.form-row{display:flex;gap:10px}
.form-label{display:block;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.form-hint{font-size:.7rem;color:var(--muted);margin-top:3px}
.form-err{color:var(--red);font-size:.78rem;min-height:1em}
.form-check{display:flex;align-items:center;gap:8px;font-size:.84rem;margin-bottom:10px;cursor:pointer}
.range-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* tables */
.tbl-wrap{overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.inv-table{width:100%;border-collapse:collapse;font-size:.8rem}
.inv-table th{background:var(--surface2);text-align:left;padding:9px 10px;font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);position:sticky;top:0;white-space:nowrap}
.inv-table td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:middle}
.inv-table tr:hover td{background:#faf7ef}
.inv-table .r{text-align:right;font-family:'Roboto Mono',monospace}
.inv-table tfoot td{font-weight:800;background:var(--surface2);border-top:2px solid var(--border)}
.inv-table tr.click{cursor:pointer}
.inv-table tr.row-cancel td{opacity:.55;text-decoration:line-through}
.empty-note{padding:26px;text-align:center;color:var(--muted);font-size:.85rem;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius)}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:.66rem;font-weight:700}
.badge-green{background:#e0f2e8;color:var(--green)}.badge-red{background:#fbe3e3;color:var(--red)}.badge-yellow{background:#fbecd6;color:var(--accent2)}.badge-gray{background:#ebe7da;color:var(--muted)}.badge-blue{background:#dfe9f6;color:var(--blue)}
.mono{font-family:'Roboto Mono',monospace}
.muted{color:var(--muted)}
.pos-c{color:var(--green)}.neg-c{color:var(--red)}

/* stat cards */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.stat-val{font-size:1.35rem;font-weight:800;margin-top:4px;font-family:'Roboto Mono',monospace}
.stat-sub{font-size:.72rem;color:var(--muted);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.card h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:.78rem}
.bar-label{width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;background:var(--surface2);border-radius:4px;height:14px}
.bar-fill{height:14px;border-radius:4px;background:var(--accent)}
.bar-val{width:90px;text-align:right;font-family:'Roboto Mono',monospace;font-size:.74rem}

/* POS */
.pos{display:flex;height:100%}
.pos-left{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border)}
.pos-top{padding:12px 14px;display:flex;gap:8px;border-bottom:1px solid var(--border);align-items:center}
.cat-filter{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;flex-shrink:0;border-bottom:1px solid var(--border);scrollbar-width:thin}
.cat-btn{padding:4px 12px;border-radius:20px;font-size:.74rem;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.cat-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.products-grid{flex:1;overflow-y:auto;padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;align-content:start}
.product-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px;cursor:pointer;transition:all .15s}
.product-card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 16px rgba(224,138,46,.15)}
.product-card:active{transform:scale(.97)}
.product-name{font-size:.8rem;font-weight:800;margin-bottom:4px;line-height:1.3}
.product-price{font-family:'Roboto Mono',monospace;font-size:.84rem;color:var(--accent);font-weight:500}
.product-stock{font-size:.68rem;color:var(--muted);margin-top:3px}
.price-code{font-family:'Roboto Mono',monospace;font-size:.68rem;font-weight:700;color:var(--navy);background:#e8e3d5;border:1px dashed var(--muted);border-radius:4px;padding:2px 6px;margin-top:5px;display:inline-block;letter-spacing:1px}
.low-stock{color:var(--yellow)!important}.out-stock{color:var(--red)!important}
.product-card.oos{opacity:.55}
.pos-right{width:380px;display:flex;flex-direction:column;flex-shrink:0;background:var(--surface)}
.cart-head{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.cust-row{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border)}
.cust-row select{flex:1}
.cart-items{flex:1;overflow-y:auto;padding:8px 10px;background:var(--bg)}
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:.82rem;gap:6px}
.cart-line{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:7px}
.cl-top{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.cl-name{font-size:.78rem;font-weight:700;line-height:1.25}
.cl-bot{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.qty-ctrl{display:flex;align-items:center;gap:3px}
.qty-btn{width:24px;height:24px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-size:1rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.qty-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini{width:62px;padding:4px 6px;font-size:.78rem;text-align:center;font-family:'Roboto Mono',monospace}
.mini.price{width:78px}
.cl-total{margin-left:auto;font-family:'Roboto Mono',monospace;font-weight:700;font-size:.82rem}
.remove-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:1rem}
.cart-foot{border-top:1px solid var(--border);padding:8px 12px;flex-shrink:0;max-height:62%;overflow-y:auto}
.cart-items{min-height:110px}
.total-row{display:flex;justify-content:space-between;font-size:.8rem;padding:2px 0;color:var(--muted)}
.total-row.big{font-size:1.1rem;font-weight:800;color:var(--text);border-top:1px dashed var(--border);margin-top:4px;padding-top:6px}
.total-row b{font-family:'Roboto Mono',monospace;color:var(--text)}
.disc-row{display:flex;gap:6px;margin:6px 0}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.pay-grid label{font-size:.66rem;font-weight:700;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:2px}
.pay-grid input{width:100%}
.due-box{padding:6px 10px;border-radius:6px;font-size:.8rem;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between}
.due-box.due{background:#fbe3e3;color:var(--red)}.due-box.ok{background:#e0f2e8;color:var(--green)}.due-box.chg{background:#fbecd6;color:var(--accent2)}
.checkout-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:12px;font-size:.95rem;font-weight:800;cursor:pointer}
.checkout-btn:hover{background:var(--accent2)}.checkout-btn:disabled{opacity:.5}
.clear-btn{width:100%;background:none;border:1px solid var(--border);border-radius:8px;padding:6px;margin-top:6px;color:var(--muted);cursor:pointer;font-size:.76rem}

/* customers / master-detail */
.md{display:flex;gap:14px;height:calc(100vh - 54px - 32px - 52px)}
.md-list{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.md-items{flex:1;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.md-item{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.md-item:hover{background:#faf7ef}.md-item.sel{background:#fbecd6;border-left:3px solid var(--accent)}
.md-item b{font-size:.84rem}
.md-item small{display:block;color:var(--muted);font-size:.7rem}
.md-item .bal{font-family:'Roboto Mono',monospace;font-size:.78rem;font-weight:700;text-align:right}
.md-detail{flex:1;overflow-y:auto;min-width:0}
.detail-head{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.detail-head h2{font-size:1.1rem}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(28,34,48,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:10px}
.modal{background:var(--surface);border-radius:12px;padding:20px 22px;width:480px;max-width:96vw;max-height:94vh;overflow-y:auto;box-shadow:0 18px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.modal h3{font-size:1.02rem;margin-bottom:14px}
.modal-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:2px 4px 2px 0}
.modal-btns{flex-shrink:0;display:flex;gap:8px;margin-top:14px;padding-top:10px;border-top:1px solid var(--border);justify-content:flex-end;flex-wrap:wrap}
.modal-cancel{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:.82rem}
.modal-save{background:var(--accent);border:none;color:#fff;border-radius:7px;padding:8px 18px;cursor:pointer;font-weight:700;font-size:.82rem}
.modal-save.danger{background:var(--red)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:10px 20px;border-radius:8px;font-size:.84rem;z-index:300;opacity:0;transition:all .25s;max-width:92vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}

/* invoice */
.invoice{background:#fff;color:#111;font-family:'Roboto',sans-serif;font-size:12px;padding:14px;border:1px solid var(--border);border-radius:8px}
.inv-head{text-align:center;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:8px}
.inv-shop{font-size:1.25rem;font-weight:900}
.inv-sub{font-size:.75rem;color:#444}
.inv-meta{display:flex;justify-content:space-between;font-size:.76rem;margin-bottom:8px;gap:10px}
.invoice table{width:100%;border-collapse:collapse;font-size:.76rem}
.invoice th{border-bottom:1px solid #111;text-align:left;padding:4px 3px}
.invoice td{padding:3px;border-bottom:1px dotted #bbb;vertical-align:top}
.invoice .r{text-align:right}
.inv-tot{margin-top:8px;margin-left:auto;width:62%;font-size:.78rem}
.inv-tot div{display:flex;justify-content:space-between;padding:1px 0}
.inv-tot .grand{font-weight:900;font-size:.95rem;border-top:2px solid #111;margin-top:3px;padding-top:3px}
.inv-foot{text-align:center;margin-top:10px;font-size:.72rem;color:#444;border-top:1px dashed #888;padding-top:6px}
.stamp{font-weight:900;color:#c00;border:3px solid #c00;display:inline-block;padding:2px 14px;transform:rotate(-8deg);font-size:1.2rem;margin:6px 0}

/* login */
.login-wrap{position:fixed;inset:0;background:linear-gradient(135deg,#1c2230,#2a3142);display:flex;align-items:center;justify-content:center;z-index:500;padding:12px;overflow:auto}
.login-card{background:var(--surface);border-radius:14px;padding:28px 30px;width:400px;max-width:100%}
.login-card h1{font-size:1.25rem;margin-bottom:2px}.login-card .sub{color:var(--muted);font-size:.8rem;margin-bottom:18px}
.login-card .btn-primary{width:100%;padding:11px;margin-top:6px}
.login-link{text-align:center;margin-top:10px;font-size:.78rem;color:var(--accent2);cursor:pointer}

.alert{padding:9px 12px;border-radius:8px;font-size:.8rem;margin-bottom:12px}
.alert.warn{background:#fbecd6;color:#7a4a0e;border:1px solid #f0cf9c}
.alert.err{background:#fbe3e3;color:#8a2222;border:1px solid #efb8b8}
.alert.info{background:#dfe9f6;color:#24476f;border:1px solid #b9cde8}
.perm-grid{display:grid;grid-template-columns:1fr 90px;gap:4px 8px;font-size:.82rem;align-items:center}
.perm-grid>div{padding:5px 0;border-bottom:1px solid var(--border)}

#printArea{display:none}
@media print{
  body.printing{display:block;overflow:visible;height:auto;background:#fff}
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block!important}
  body.pr-thermal #printArea .invoice{width:76mm;border:none;padding:0;font-size:11px}
  body.pr-a4 #printArea .invoice{border:none;width:100%}
  @page{margin:8mm}
}
@media(max-width:1000px){
  .pos-right{width:330px}.grid2{grid-template-columns:1fr}
  .md{flex-direction:column;height:auto}.md-list{width:100%}.md-items{max-height:240px}
}
@media(max-width:820px){
  .hamb{display:block}
  .sidebar{position:fixed;top:54px;bottom:0;left:0;z-index:60;transform:translateX(-100%);transition:transform .2s}
  body.nav-open .sidebar{transform:none}
  .pos{flex-direction:column;height:auto}.pos-right{width:100%}.pos-left{border-right:none}
  .products-grid{max-height:50vh}.topbar-right .clk,.topbar-right .bkwrap{display:none}
  .form-row{flex-direction:column;gap:0}
}

/* product picker */
.pk{position:relative}
.pk-list{position:absolute;left:0;right:0;top:100%;background:var(--surface);border:1px solid var(--accent);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:20;max-height:260px;overflow-y:auto}
.pk-item{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--border);font-size:.82rem}
.pk-item:hover{background:#fbecd6}.pk-item small{display:block;color:var(--muted);font-size:.7rem}
/* printed reports */
.rep-print{font-family:'Roboto',Arial,sans-serif;color:#111;padding:6px}
.rep-print .inv-table,.rep-tbl{width:100%;border-collapse:collapse;font-size:11px}
.rep-print .inv-table th,.rep-tbl th{border-bottom:2px solid #111;text-align:left;padding:4px;background:#fff;position:static}
.rep-print .inv-table td,.rep-tbl td{border-bottom:1px solid #ccc;padding:3px 4px}
.rep-print .tbl-wrap{border:none;overflow:visible}
.rep-print .r{text-align:right}
.rep-print .stat-card,.rep-print .card{border:1px solid #ccc;margin-bottom:6px}
.rep-print .total-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.rep-print .alert{border:1px solid #ccc;padding:4px;font-size:11px}

.mode-row{display:flex;gap:5px;margin:8px 0 2px}
.mode-row button{flex:1;padding:9px 4px;border:1.5px solid var(--border);background:var(--surface);border-radius:8px;font-weight:700;font-size:.78rem;cursor:pointer;color:var(--text)}
.mode-row button.on{background:var(--navy,#1b2540);color:#fff;border-color:var(--navy,#1b2540)}
.mode-row button.on.cr{background:var(--accent,#e08a2d);border-color:var(--accent,#e08a2d)}

</style>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#1c2230">
</head>
<body>
<div id="auth" class="hidden"></div>

function bindPicker(id, onPick, opts) {
  opts = opts || {}; const q = $('#' + id + '-q'), l = $('#' + id + '-l'); if (!q) return;
  const run = () => {
    const s = q.value.trim(); if (!s) { l.classList.add('hidden'); return; }
    const rows = db.products.filter(p => (opts.all || p.active) && matchesQuery(prodHay(p), s)).slice(0, 10);
    l.innerHTML = rows.map(p => `<div class="pk-item" data-id="${p.id}"><b>${esc(p.name)}</b><small>${esc(p.sku)} · stock ${qtyFmt(totalStock(p))} ${esc(p.unit)} · ${money(p.price)}</small></div>`).join('') || '<div class="pk-item muted">No match</div>';
    l.classList.remove('hidden');

  q.addEventListener('input', run);
  q.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); const s = q.value.trim(); const ex = db.products.find(p => p.active && (p.barcode === s || p.sku.toLowerCase() === s.toLowerCase())); const first = ex || (l.querySelector('.pk-item[data-id]') && prod(+l.querySelector('.pk-item[data-id]').dataset.id)); if (first) { pick(first.id); } }

function filteredProducts() {
  return db.products.filter(p => {
    if (PS.cat && p.cat !== PS.cat) return false;
    if (PS.brand && p.brand !== PS.brand) return false;
    const t = totalStock(p);
    if (PS.stock === 'low' && !(t > 0 && t <= minStockOf(p))) return false;
    if (PS.stock === 'out' && t > 0) return false;
    if (PS.stock === 'inactive' && p.active) return false;
    if (PS.stock !== 'inactive' && PS.stock !== 'all' && PS.stock !== '' && false) return false;
    if (PS.q && !matchesQuery(prodHay(p), PS.q)) return false;
    return true;
  });
}

function saveProduct(id) {

  const units = []; let bad = '';

  if (bad) return err(bad);
  const cat = val('pmCat'); const brand = val('pmBrand').trim();
  const minV = val('pmMin'); const rec = {

    unit, units, price, minStock: minV === '' ? null : num(minV), hot: chk('pmHot'), active: chk('pmAct')
  };

  if (id) {

    logAct('Product edited', `${p.name} (${p.sku})${old.price !== p.price ? ' price ' + old.price + '→' + p.price : ''}${old.cost !== p.cost ? ' cost ' + old.cost + '→' + p.cost : ''}`);
  } else {
    const np = Object.assign({ id: nextId('product'), cost: 0, st: {} }, rec);
    while (db.products.some(x => x.id === np.id)) np.id = nextId('product');
    db.products.push(np);
    $$('.pm-open').forEach(i => { const q = num(i.value); if (q) moveStock(np.id, +i.dataset.loc, q, 'opening', {}, 'Opening stock'); });
    logAct('Product added', `${np.name} (${np.sku})`);

function productHasHistory(id) {

}

/* ---------- CSV import / export ---------- */
function parseCSV(text) {
  text = text.replace(/^﻿/, ''); const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; } else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
const PCSV = [{ h: 'SKU', fn: p => p.sku }, { h: 'Name', fn: p => p.name }, { h: 'Category', fn: p => p.cat }, { h: 'Subcategory', fn: p => p.sub }, { h: 'Brand', fn: p => p.brand }, { h: 'Size', fn: p => p.size }, { h: 'Color', fn: p => p.color }, { h: 'Model', fn: p => p.model }, { h: 'Unit', fn: p => p.unit }, { h: 'Barcode', fn: p => p.barcode }, { h: 'Cost', fn: p => p.cost }, { h: 'Price', fn: p => p.price }, { h: 'Stock', fn: p => totalStock(p) }, { h: 'MinStock', fn: p => p.minStock == null ? '' : p.minStock }, { h: 'Active', fn: p => p.active ? 'yes' : 'no' }];
function exportProductsCSV() {
  const cols = can('viewCost') ? PCSV : PCSV.filter(c => c.h !== 'Cost');
  downloadFile('products-' + today() + '.csv', toCSV(cols, db.products), 'text/csv'); logAct('Export', 'Products CSV');
}
function openProductImport() {
  openModal({
    title: 'Import / update products from CSV', width: 560, body: `<div class="alert info">Use <b>Export CSV</b> first, edit it in Excel (for example fill the <b>Cost</b> column), then import it here. Rows are matched by <b>SKU</b>; unknown SKUs create new products. The <b>Stock</b> column only sets stock for <b>new</b> products.</div>
    <input type="file" id="impFile" accept=".csv,text/csv"><div id="impOut" style="margin-top:10px;font-size:.82rem"></div>`, buttons: [{ label: 'Close', cls: 'modal-cancel', act: closeTop }, { label: 'Import', cls: 'modal-save', act: runProductImport }]
  });
}
function runProductImport() {
  const f = $('#impFile').files[0]; if (!f) return toast('Choose a CSV file first', 'err');
  const rd = new FileReader(); rd.onload = () => doProductImport(String(rd.result)); rd.readAsText(f);
}
function doProductImport(text) {
  const rows = parseCSV(text); if (rows.length < 2) return toast('The file is empty', 'err');
  const head = rows[0].map(h => h.trim().toLowerCase()); const ix = n => head.indexOf(n);
  if (ix('name') < 0 || ix('price') < 0) return toast('CSV needs at least Name and Price columns', 'err');
  let added = 0, updated = 0, skipped = 0;
  rows.slice(1).forEach(r => {
    const g = n => ix(n) >= 0 ? (r[ix(n)] || '').trim() : null; const name = g('name'); if (!name) { skipped++; return; }
    const sku = g('sku'); let p = sku ? db.products.find(x => x.sku.toLowerCase() === sku.toLowerCase()) : null;
    const set = (o) => { if (g('category') !== null && g('category')) { o.cat = g('category'); if (!db.categories.some(c => c.name === o.cat)) db.categories.push({ name: o.cat, subs: [] }); } ['subcategory:sub', 'brand:brand', 'size:size', 'color:color', 'model:model', 'unit:unit'].forEach(m => { const [c, k] = m.split(':'); const v = g(c); if (v !== null && (v || p)) o[k] = v || o[k] || (k === 'unit' ? 'Piece' : ''); }); if (g('price') !== null && g('price') !== '') o.price = num(g('price')); if (g('cost') !== null && g('cost') !== '' && can('viewCost')) o.cost = num(g('cost')); if (g('minstock') !== null) o.minStock = g('minstock') === '' ? null : num(g('minstock')); if (g('active') !== null && g('active')) o.active = !/^(no|false|0)$/i.test(g('active')); const bc = g('barcode'); if (bc !== null && bc && !barcodeTaken(bc, o.id)) o.barcode = bc; };
    if (p) { p.name = name; set(p); updated++; }
    else {

const POS = { cart: [], custId: 0, discType: 'pct', discVal: '', taxOn: true, cash: '', bank: '', card: '', ref: '', note: '', touched: false, mode: 'paid', cat: 'Hot Selling', q: '', editId: 0, priceUnlocked: false, discOk: '' };
const getCust = id => db.customers.find(c => c.id === id);
const custName = id => { const c = getCust(id); return c ? c.name : 'Walk-in'; };
const paidOf = s => r2(s.payments.reduce((a, p) => a + p.amount, 0));
const dueOf = s => s.status === 'cancelled' ? 0 : Math.max(0, r2(s.total - (s.returned || 0) - paidOf(s)));
function custBalance(id) { let b = 0; for (const e of db.ledger) if (e.customerId === id) b += e.debit - e.credit; return r2(b); }
function custBalances() { const m = {}; for (const e of db.ledger) m[e.customerId] = (m[e.customerId] || 0) + e.debit - e.credit; return m; }

/* ---------- stock deduction across locations ---------- */
function deductStock(pid, baseQty, type, ref) {
  const p = prod(pid); const alloc = []; let rem = baseQty; const order = db.locations.map(l => l.id);
  for (const loc of order) { if (rem <= 0) break; const av = Math.max(locStock(p, loc), 0); const take = Math.min(av, rem); if (take > 0) { moveStock(pid, loc, -take, type, ref); alloc.push({ loc, qty: take }); rem = r3(rem - take); } }
  if (rem > 0) { moveStock(pid, order[0], -rem, type, ref); const a = alloc.find(x => x.loc === order[0]); if (a) a.qty = r3(a.qty + rem); else alloc.push({ loc: order[0], qty: rem }); }
  return alloc;
}
function restoreStock(item, type, ref, note) {
  const al = item.alloc && item.alloc.length ? item.alloc : [{ loc: defLoc(), qty: item.baseQty }];
  al.forEach(a => moveStock(item.pid, a.loc, a.qty, type, ref, note));
}

/* ---------- hot selling list ---------- */
function hotList() {
  const from = addDays(today(), -30), cnt = {};
  db.sales.forEach(s => { if (s.status !== 'cancelled' && s.date >= from) s.items.forEach(i => { cnt[i.pid] = (cnt[i.pid] || 0) + i.baseQty; }); });
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 24).map(e => +e[0]);
  const ids = new Set(db.products.filter(p => p.hot && p.active).map(p => p.id).concat(top));
  return db.products.filter(p => ids.has(p.id) && p.active);
}

/* ---------- cart ---------- */
function addToCart(pid, unit) {
  const p = prod(pid); if (!p) return; unit = unit || p.unit;
  if (db.settings.blockNegative && totalStock(p) <= 0) return toast('Out of stock: ' + p.name, 'err');
  const ex = POS.cart.find(l => l.pid === pid && l.unit === unit);
  if (ex) ex.qty = r3(ex.qty + 1); else { const up = unitPrice(p, unit); POS.cart.push({ pid, unit, qty: 1, price: up, zero: up <= 0 }); if (up <= 0) toast('No price saved for this item — type the price in the bill'); }
  if (!POS.touched) POS.cash = ''; drawCart();
}
function cartCalc() {
  const subtotal = r2(POS.cart.reduce((s, l) => s + l.qty * l.price, 0));
  let disc = POS.discType === 'pct' ? subtotal * num(POS.discVal) / 100 : num(POS.discVal); disc = r2(Math.min(Math.max(disc, 0), subtotal));
  const taxRate = db.settings.taxEnabled && POS.taxOn ? num(db.settings.taxRate) : 0; const tax = r2((subtotal - disc) * taxRate / 100);
  const total = r2(subtotal - disc + tax);
  let cash = POS.touched ? num(POS.cash) : total; const bank = num(POS.bank), card = num(POS.card);
  const cashApplied = Math.max(0, Math.min(cash, r2(total - bank - card)));
  const paid = r2(cashApplied + bank + card); const due = Math.max(0, r2(total - paid)); const change = Math.max(0, r2(cash - cashApplied));
  return { subtotal, disc, tax, taxRate, total, cash, cashApplied, bank, card, paid, due, change, over: r2(bank + card - total) > 0.009 };
}
function drawCart() {
  const el = $('#posCart'); if (!el) return;
  $('#cartCount').textContent = POS.cart.length ? POS.cart.length + ' item' + (POS.cart.length > 1 ? 's' : '') : '';
  if (!POS.cart.length) { el.innerHTML = `<div class="cart-empty"><div style="font-size:2.4rem;opacity:.3">🛒</div><div>Bill is empty</div><div style="font-size:.72rem">Click a product or scan a barcode</div></div>`; }
  else el.innerHTML = POS.cart.map((l, i) => {
    const p = prod(l.pid); const ro = !(can('priceChange') || POS.priceUnlocked || l.zero);
    const unitSel = (p.units || []).length ? `<select class="select-input" style="padding:3px 4px;font-size:.74rem" onchange="changeLineUnit(${i},this.value)">${[p.unit].concat(p.units.map(u => u.name)).map(u => `<option ${u === l.unit ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select>` : `<span class="muted" style="font-size:.72rem">${esc(l.unit)}</span>`;
    const stockWarn = totalStock(p) < l.qty * unitFactor(p, l.unit) ? `<div class="out-stock" style="font-size:.66rem">Only ${qtyFmt(totalStock(p))} ${esc(p.unit)} in stock</div>` : '';
    return `<div class="cart-line"><div class="cl-top"><div class="cl-name">${esc(p.name)}${stockWarn}</div><button class="remove-btn" onclick="removeLine(${i})" title="Remove">✕</button></div>
      <div class="cl-bot"><div class="qty-ctrl"><button class="qty-btn" onclick="lineQty(${i},-1)">−</button><input class="form-input mini" type="number" step="any" value="${l.qty}" onchange="setLineQty(${i},this.value)"><button class="qty-btn" onclick="lineQty(${i},1)">+</button></div>${unitSel}
      <span class="muted">×</span><input class="form-input mini price" type="number" step="any" value="${l.price}" ${ro ? 'readonly title="Click to change price (needs permission)"' : ''} onfocus="${ro ? `unlockPrice(${i});this.blur()` : ''}" onchange="setLinePrice(${i},this.value)"><span class="cl-total">${fmt(l.qty * l.price)}</span></div></div>`;
  }).join('');
  drawFoot();
}
function lineQty(i, d) { const l = POS.cart[i]; l.qty = r3(l.qty + d); if (l.qty <= 0) POS.cart.splice(i, 1); if (!POS.touched) POS.cash = ''; drawCart(); }
function setLineQty(i, v) { const q = num(v); if (q <= 0) POS.cart.splice(i, 1); else POS.cart[i].qty = q; if (!POS.touched) POS.cash = ''; drawCart(); }
function setLinePrice(i, v) { const pr = num(v); if (pr < 0) return; POS.cart[i].price = pr; if (!POS.touched) POS.cash = ''; drawCart(); }
function removeLine(i) { POS.cart.splice(i, 1); if (!POS.touched) POS.cash = ''; drawCart(); }
function unlockPrice(i) { guard('priceChange', 'Changing the selling price', () => { POS.priceUnlocked = true; drawCart(); toast('Price editing unlocked for this bill'); }); }
function changeLineUnit(i, u) { const l = POS.cart[i]; const p = prod(l.pid); l.unit = u; l.price = unitPrice(p, u); drawCart(); }
function clearCart() { POS.cart = []; POS.discVal = ''; POS.cash = POS.bank = POS.card = POS.ref = POS.note = ''; POS.touched = false; POS.mode = 'paid'; POS.priceUnlocked = false; POS.discOk = ''; POS.editId = 0; drawCart(); }

/* ---------- checkout ---------- */
function discNeedsApproval(c) {
  if (isAdmin() || c.disc <= 0) return false; const pct = c.subtotal ? c.disc / c.subtotal * 100 : 0; const key = c.disc + ':' + c.subtotal;
  if (POS.discOk === key) return false; return !can('discount') || pct > num(db.settings.cashierMaxDisc) + 0.0001;
}
function checkout() {
  if (!POS.cart.length) return; const c = cartCalc(); const cust = POS.custId ? getCust(POS.custId) : null; const editing = POS.editId ? db.sales.find(s => s.id === POS.editId) : null;
  if (c.over) return toast('Bank + card cannot be more than the total', 'err');
  const noPrice = POS.cart.find(l => !(l.price > 0)); if (noPrice) return toast('Enter a selling price for: ' + prod(noPrice.pid).name, 'err');
  if (c.total <= 0) return toast('Total is zero — check the discount', 'err');
  if (c.due > 0.009 && !cust) return toast('Pick a customer for credit / partial payment (walk-in must pay in full)', 'err');
  if (db.settings.blockNegative) { for (const l of POS.cart) { const p = prod(l.pid); const avail = totalStock(p) + (editing ? editing.items.filter(i => i.pid === l.pid).reduce((a, i) => a + i.baseQty, 0) : 0); const need = POS.cart.filter(x => x.pid === l.pid).reduce((a, x) => a + x.qty * unitFactor(p, x.unit), 0); if (need > avail + 0.0001) return toast(`Not enough stock: ${p.name} (have ${qtyFmt(avail)})`, 'err'); } }
  const steps = [];
  if (discNeedsApproval(c)) steps.push(next => askApproval(`A discount of ${fmt(c.disc)} (${r2(c.disc / c.subtotal * 100)}%)`, ok => { if (ok) { POS.discOk = c.disc + ':' + c.subtotal; next(); } }));
  if (c.due > 0.009 && !can('creditSale')) steps.push(next => askApproval('Selling on credit / partial payment', ok => ok && next()));
  if (c.due > 0.009 && cust && num(cust.creditLimit) > 0) { const after = custBalance(cust.id) + c.due - (editing ? dueOf(editing) : 0); if (after > cust.creditLimit && !isAdmin()) steps.push(next => askApproval(`${cust.name}'s balance would be ${fmt(after)} — above the credit limit of ${fmt(cust.creditLimit)}`, ok => ok && next())); }
  const below = POS.cart.filter(l => { const p = prod(l.pid); return p.cost > 0 && l.price < p.cost * unitFactor(p, l.unit) - 0.001; });
  if (below.length && !isAdmin()) steps.push(next => askApproval('Selling below purchase price: ' + below.map(l => prod(l.pid).name).slice(0, 2).join(', '), ok => ok && next()));
  const run = i => { if (i < steps.length) steps[i](() => run(i + 1)); else finalizeSale(c, cust, editing); };
  run(0);
}
function finalizeSale(c, cust, editing) {
  const ts = nowISO(); const items = POS.cart.map(l => { const p = prod(l.pid); const f = unitFactor(p, l.unit); return { pid: l.pid, name: p.name, sku: p.sku, unit: l.unit, factor: f, qty: l.qty, price: l.price, baseQty: r3(l.qty * f), cost: p.cost || 0, retQty: 0, alloc: [] }; });
  let sale;
  if (editing) {
    const hist = { ts, user: cu().name, total: editing.total, items: editing.items.length }; unpostSale(editing); sale = editing; sale.history = (sale.history || []).concat([hist]); sale.editedAt = ts; sale.editedBy = cu().name;
  } else { const id = nextId('sale'); sale = { id, no: 'INV-' + pad(id, 5), ts, date: today(), userId: cu().id, userName: cu().name, status: 'completed', returned: 0, returnIds: [], history: [] }; db.sales.push(sale); }
  const pay = []; if (c.cashApplied > 0) pay.push({ method: 'cash', amount: r2(c.cashApplied), ts, kind: 'sale' }); if (c.bank > 0) pay.push({ method: 'bank', amount: r2(c.bank), ts, kind: 'sale', ref: POS.ref }); if (c.card > 0) pay.push({ method: 'card', amount: r2(c.card), ts, kind: 'sale', ref: POS.ref });
  Object.assign(sale, { customerId: cust ? cust.id : 0, customerName: cust ? cust.name : 'Walk-in', customerPhone: cust ? cust.phone || '' : '', items, subtotal: c.subtotal, discType: POS.discType, discValue: num(POS.discVal), discAmt: c.disc, taxRate: c.taxRate, taxName: db.settings.taxName, taxAmt: c.tax, total: c.total, payments: pay, note: POS.note.trim(), change: c.change });
  postSale(sale);
  logAct(editing ? 'Bill edited' : 'Sale', `${sale.no} ${sale.customerName} ${fmt(sale.total)}${c.due > 0 ? ' (due ' + fmt(c.due) + ')' : ''}`);
  save(); const keepCust = POS.custId; clearCart(); POS.custId = 0; fillCustSelect && null; renderPOS($('#pageRoot')); updateBadges();
  toast(editing ? 'Bill updated' : 'Sale completed', 'ok'); showInvoice(sale.id);
}
function postSale(sale) {
  const ref = { type: 'sale', id: sale.id, no: sale.no };
  sale.items.forEach(i => { i.alloc = deductStock(i.pid, i.baseQty, 'sale', ref); });
  if (sale.customerId) {
    db.ledger.push({ id: nextId('led'), ts: sale.ts, date: sale.date, customerId: sale.customerId, type: 'sale', refType: 'sale', refId: sale.id, refNo: sale.no, debit: sale.total, credit: 0, note: 'Invoice ' + sale.no });
    sale.payments.forEach(p => db.ledger.push({ id: nextId('led'), ts: p.ts, date: sale.date, customerId: sale.customerId, type: 'payment', refType: 'sale', refId: sale.id, refNo: sale.no, debit: 0, credit: p.amount, method: p.method, note: 'Paid at billing (' + PAY_METHODS[p.method] + ')' }));
  }
  sale.payments.forEach(p => db.cashbook.push({ id: nextId('cb'), ts: p.ts, date: sale.date, type: 'in', cat: 'Sales', method: p.method, amount: p.amount, refType: 'sale', refId: sale.id, refNo: sale.no, party: sale.customerName, user: cu().name, note: 'Sale ' + sale.no }));
}
function unpostSale(sale) {
  sale.items.forEach(i => restoreStock(i, 'sale-edit', { type: 'sale', id: sale.id, no: sale.no }, 'Bill edited'));
  db.ledger = db.ledger.filter(e => !(e.refType === 'sale' && e.refId === sale.id));
  db.cashbook = db.cashbook.filter(e => !(e.refType === 'sale' && e.refId === sale.id));
}

/* ---------- edit / cancel / delete ---------- */
function editSale(id) {
  const s = db.sales.find(x => x.id === id); if (!s) return;
  guard('editBill', 'Editing a saved bill', () => {
    if (s.status !== 'completed') return toast('Cancelled bills cannot be edited', 'err');
    if ((s.returnIds || []).length) return toast('This bill has returns — it can no longer be edited', 'err');
    if (s.payments.some(p => p.kind === 'receipt')) return toast('Later payments were received against this bill — cancel it or use a return instead', 'err');
    closeAllModals(); POS.cart = s.items.map(i => ({ pid: i.pid, unit: i.unit, qty: i.qty, price: i.price })); POS.custId = s.customerId; POS.discType = s.discType; POS.discVal = s.discValue || ''; POS.taxOn = s.taxRate > 0;
    POS.cash = ''; POS.bank = ''; POS.card = ''; s.payments.forEach(p => { POS[p.method] = String((+POS[p.method] || 0) + p.amount); }); POS.touched = true; POS.mode = paidOf(s) <= 0 ? 'credit' : dueOf(s) > 0 ? 'part' : 'paid'; POS.note = s.note || ''; POS.ref = ''; POS.editId = s.id; POS.discOk = s.discAmt + ':' + s.subtotal; go('pos');
  });
}
function cancelSaleModal(id) {
  const s = db.sales.find(x => x.id === id); if (!s) return;
  guard('cancelBill', 'Cancelling a bill', () => {
    if (s.status !== 'completed') return toast('Already cancelled', 'err'); if ((s.returnIds || []).length) return toast('This bill has returns and cannot be cancelled', 'err');
    const paid = paidOf(s);
    openModal({
      title: 'Cancel ' + esc(s.no), width: 440, body: `<p style="font-size:.85rem;margin-bottom:10px">Stock goes back to the shelf and the bill is voided. It stays in the records as <b>Cancelled</b>.</p>${fld({ id: 'cnReason', label: 'Reason *', ph: 'e.g. wrong items, customer changed mind' })}
      ${paid > 0 ? `<div class="alert info">Customer paid ${money(paid)} on this bill.</div>${fld({ id: 'cnRef', label: 'What happens to that money?', type: 'select', options: [['refund', 'Refund it now (cash book shows money out)'], ...(s.customerId ? [['credit', 'Keep as credit on the customer account']] : [])] })}` : ''}<div id="cnErr" class="form-err"></div>`,
      buttons: [{ label: 'Keep bill', cls: 'modal-cancel', act: closeTop }, { label: 'Cancel this bill', cls: 'modal-save danger', act: () => { const r = val('cnReason').trim(); if (!r) return $('#cnErr').textContent = 'A reason is required.'; doCancelSale(s, r, paid > 0 ? val('cnRef') : ''); closeTop(); } }]
    });
  });

function doCancelSale(s, reason, refundMode) {

/* ---------- receive payment ---------- */
function allocateReceipt(cid, amount, method, ts, receiptId, prefSaleId, ref) {
  let rem = amount; const open = db.sales.filter(s => s.customerId === cid && s.status === 'completed' && dueOf(s) > 0).sort((a, b) => (a.id === prefSaleId ? -1 : b.id === prefSaleId ? 1 : (a.ts < b.ts ? -1 : 1)));
  const applied = [];
  for (const s of open) { if (rem <= 0.0001) break; const take = Math.min(dueOf(s), rem); if (take > 0) { s.payments.push({ method, amount: r2(take), ts, kind: 'receipt', receiptId, ref: ref || '' }); applied.push({ no: s.no, amt: r2(take) }); rem = r2(rem - take); } }
  return { applied, advance: r2(rem) };
}
function openReceivePayment(cid, saleId) {

function supLedgerRows(sid, r) { let run = 0, open = 0; const out = []; db.supLedger.filter(e => e.supplierId === sid).sort((a, b) => a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : a.id - b.id).forEach(e => { if (e.date < r.from) { open += e.credit - e.debit; run = open; return; } if (e.date > r.to) return; run += e.credit - e.debit; out.push(Object.assign({}, e, { run: r2(run) })); }); return { rows: out, opening: r2(open), closing: r2(run) }; }

/* ---------- day closing / reconciliation ---------- */
function cashBefore(date) { return r2(db.cashbook.filter(e => e.method === 'cash' && e.date < date).reduce((a, e) => a + (e.type === 'in' ? e.amount : -e.amount), 0)); }
function openingCash(date) { const prev = db.closings.filter(c => c.date < date).sort((a, b) => a.date < b.date ? 1 : -1)[0]; if (!prev) return { amount: cashBefore(date), src: 'calculated from the cash book' }; const after = r2(db.cashbook.filter(e => e.method === 'cash' && e.date > prev.date && e.date < date).reduce((a, e) => a + (e.type === 'in' ? e.amount : -e.amount), 0)); return { amount: r2(prev.counted + after), src: 'counted at close of ' + fmtDate(prev.date) + (after ? ' plus movements since' : '') }; }
function drawClosing() {
  const date = AC.cdate || today(); AC.cdate = date; const op = openingCash(date); const day = db.cashbook.filter(e => e.date === date); const cIn = day.filter(e => e.type === 'in' && e.method === 'cash'), cOut = day.filter(e => e.type === 'out' && e.method === 'cash');
  const sumIn = cIn.reduce((a, e) => a + e.amount, 0), sumOut = cOut.reduce((a, e) => a + e.amount, 0); const expected = r2(op.amount + sumIn - sumOut); const ex = db.closings.find(c => c.date === date);
  const grp = list => { const m = {}; list.forEach(e => m[e.cat] = (m[e.cat] || 0) + e.amount); return Object.entries(m).map(([k, v]) => `<div class="bar-row"><span class="bar-label" style="width:200px">${esc(k)}</span><span class="bar-val" style="width:auto">${fmt(v)}</span></div>`).join('') || '<div class="muted" style="font-size:.8rem">—</div>'; };
  const bank = day.filter(e => e.method === 'bank'), card = day.filter(e => e.method === 'card'); const net = l => l.reduce((a, e) => a + (e.type === 'in' ? e.amount : -e.amount), 0);
  $('#acBody').innerHTML = `<div class="tools" style="margin-bottom:12px"><label class="form-label" style="margin:0">Date</label><input type="date" class="select-input" id="clDate" value="${date}">${can('accounts') && !db.closings.length ? `<button class="btn" onclick="openCashEntry('in')">Set opening cash balance</button>` : ''}</div>
  <div class="grid2"><div class="card"><h4>Cash drawer — ${fmtDate(date)}</h4><div class="total-row"><span>Opening cash <small class="muted">(${esc(op.src)})</small></span><b>${money(op.amount)}</b></div><div class="total-row"><span>+ Cash in</span><b class="pos-c">${money(sumIn)}</b></div>${grp(cIn)}<div class="total-row" style="margin-top:6px"><span>− Cash out</span><b class="neg-c">${money(sumOut)}</b></div>${grp(cOut)}<div class="total-row big"><span>Expected in drawer</span><b>${money(expected)}</b></div></div>
  <div class="card"><h4>Count the drawer</h4>${fld({ id: 'clCount', label: 'Cash actually counted (Rs)', type: 'number', value: ex ? ex.counted : '' })}<div id="clDiff" class="due-box ok" style="display:none"></div>${fld({ id: 'clNote', label: 'Note (reason for any difference)', value: ex ? ex.note : '' })}<button class="btn-primary" onclick="saveClosing('${date}',${op.amount},${sumIn},${sumOut},${expected})">${ex ? 'Update closing' : 'Save day closing'}</button>${ex ? `<div class="muted" style="font-size:.75rem;margin-top:6px">Closed by ${esc(ex.user)} at ${fmtTime(ex.ts)}. Difference then: ${fmt(ex.diff)}</div>` : ''}
   <div style="margin-top:14px;font-size:.8rem" class="muted">Other money today (not in drawer): Bank ${fmt(net(bank))} · Card ${fmt(net(card))}</div></div></div>

/* ---------- profit & loss ---------- */
function calcPL(r) {
  const sales = db.sales.filter(s => s.status !== 'cancelled' && inRange(s.date, r)); const rets = db.returns.filter(x => inRange(x.date, r));
  let gross = 0, disc = 0, tax = 0, cogs = 0, noCost = 0;
  sales.forEach(s => { gross += s.subtotal; disc += s.discAmt; tax += s.taxAmt; s.items.forEach(i => { cogs += i.cost * i.baseQty; if (!i.cost) noCost++; }); });
  let retEx = 0, retTax = 0, retCost = 0;
  rets.forEach(x => { const s = db.sales.find(y => y.id === x.saleId); const tr = s ? s.taxRate : 0; const ex = x.amount / (1 + tr / 100); retEx += ex; retTax += x.amount - ex; if (x.cond === 'restock') x.items.forEach(i => retCost += i.cost * i.baseQty); });
  const netSales = r2(gross - disc - retEx); const cogsNet = r2(cogs - retCost); const gp = r2(netSales - cogsNet);
  const wo = db.stockMoves.filter(m => inRange(m.date, r) && (m.type === 'damage' || m.type === 'missing' || m.type === 'found')).reduce((a, m) => { const p = prod(m.pid); return a - m.qty * (p ? p.cost || 0 : 0); }, 0);
  const exp = db.expenses.filter(e => inRange(e.date, r)); const expTot = r2(exp.reduce((a, e) => a + e.amount, 0)); const byCat = {}; exp.forEach(e => byCat[e.cat] = (byCat[e.cat] || 0) + e.amount);
  return { gross: r2(gross), disc: r2(disc), retEx: r2(retEx), netSales, cogs: cogsNet, gp, wo: r2(wo), expTot, byCat, net: r2(gp - wo - expTot), tax: r2(tax - retTax), noCost, invoices: sales.length, margin: netSales ? gp / netSales * 100 : 0 };
}

  $('#acBody').innerHTML = `<div class="tools" style="margin-bottom:12px">${dateRangeBar('plR')}<button class="btn" id="plPrint">🖨 Print</button></div><div id="plT"></div>`;
  const draw = () => {
    const r = readRange('plR'); AC.range = r.key; const d = calcPL(r); window._pl = { r, d }; const row = (k, v, cls, b) => `<div class="total-row ${b ? 'big' : ''}"><span>${k}</span><b class="${cls || ''}">${money(v)}</b></div>`;

/* ---------- backup & restore ---------- */
function backupPayload() { return JSON.stringify({ app: 'akbar-pos', version: DB_VERSION, exportedAt: nowISO(), exportedBy: cu() ? cu().name : '', data: db }); }
function downloadBackup(auto) {
  const name = `akbar-pos-backup-${today()}-${pad(new Date().getHours())}${pad(new Date().getMinutes())}.json`; downloadFile(name, backupPayload(), 'application/json');
  db.meta.lastFileBackup = nowISO(); logAct(auto ? 'Auto backup file' : 'Backup downloaded', name); save(); updateBackupDot(); if (!auto) { toast('Backup file downloaded — keep it somewhere safe', 'ok', 4000); refresh(); }
}
let _chg = 0, _lastBkChg = -1;
async function autoBackup(label) {
  try { const text = JSON.stringify(db); await Store.backupPut({ id: Date.now(), ts: nowISO(), label: label || 'auto', size: text.length, data: text }); db.meta.lastAutoBackup = nowISO(); _lastBkChg = _chg; const list = await Store.backupList(); const keep = list.filter(b => b.label !== 'manual'); for (const b of keep.slice(20)) await Store.backupDelete(b.id); save(); return true; } catch (e) { console.error(e); return false; }
}
function updateBackupDot() { const d = $('#bkDot'); if (!d || !db) return; const lf = db.meta.lastFileBackup; const old = !lf || (Date.now() - new Date(lf)) / 864e5 > 7; d.className = 'bk-dot' + (old ? ' warn' : ''); d.title = old ? 'No recent backup file — click to open backup settings' : 'Backup file downloaded ' + fmtDate(isoToLocalDate(lf)); }

  <div class="card" style="margin-top:20px;border-color:#efb8b8"><h4 style="color:var(--red)">Danger zone</h4><p style="font-size:.82rem;margin-bottom:8px">Erase all sales, customers, purchases and settings and start fresh with the original product list. Download a backup first!</p><button class="btn red" onclick="resetAllData()">Erase everything…</button></div>`;
  $('#restoreFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => restoreFromText(String(rd.result), f.name); rd.readAsText(f); };

async function manualSnapshot() { const ok = await autoBackup('manual'); toast(ok ? 'Snapshot saved' : 'Could not save snapshot', ok ? 'ok' : 'err'); refresh(); }

function restoreFromText(text, label, raw) {

  const data = raw ? obj : (obj.app === 'akbar-pos' ? obj.data : null); if (!data || !Array.isArray(data.products) || !Array.isArray(data.users) || !data.settings) return toast('That file is not an Akbar POS backup', 'err');

function migrateDB() {
  const d = db; const base = newDB();
  Object.keys(base).forEach(k => { if (d[k] === undefined) d[k] = base[k]; });
  d.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings); d.perms = d.perms || {}; d.perms.cashier = Object.assign({}, CASHIER_DEFAULT, d.perms.cashier || {});
  d.meta = Object.assign({ seq: {}, lastAutoBackup: '', lastFileBackup: '', recovery: null }, d.meta); d.v = DB_VERSION;
  if (!d.locations.length) d.locations = base.locations;
  if (!d.meta.skuV) { renumberSkus(); d.meta.skuV = 1; dirty = true; }
}

/* ----- login ----- */
let _fails = 0, _lockUntil = 0;
function showLogin() {
  const a = $('#auth'); a.classList.remove('hidden'); currentUser = null; applyBranding();
  a.innerHTML = `<div class="login-wrap"><div class="login-card"><h1>${esc(db.settings.shopName)}</h1><div class="sub">Sign in to continue</div><div class="form-group"><label class="form-label">Username</label><input class="form-input" id="lgUser" autocomplete="username"></div><div class="form-group"><label class="form-label">Password</label><input class="form-input" id="lgPw" type="password" autocomplete="current-password"></div><div id="lgErr" class="form-err"></div><button class="btn-primary" id="lgGo">Sign in</button><div class="login-link" id="lgForgot">Forgot admin password?</div></div></div>`;
  const go = () => {
    const now = Date.now(); if (now < _lockUntil) return $('#lgErr').textContent = `Too many attempts. Wait ${Math.ceil((_lockUntil - now) / 1000)} seconds.`;
    const u = checkLogin(val('lgUser'), val('lgPw'));
    if (!u) { _fails++; if (_fails >= 5) { _lockUntil = Date.now() + 30000; _fails = 0; $('#lgErr').textContent = 'Too many wrong attempts. Locked for 30 seconds.'; } else $('#lgErr').textContent = 'Wrong username or password.'; return; }
    _fails = 0; currentUser = u; u.lastLogin = nowISO(); sess.set('akbar_uid', u.id); logAct('Login', u.username); save(); startApp();
  };
  $('#lgGo').onclick = go; $('#lgPw').onkeydown = $('#lgUser').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#lgForgot').onclick = showRecovery; setTimeout(() => $('#lgUser') && $('#lgUser').focus(), 30);
}
function showRecovery() {
  const a = $('#auth');
  a.innerHTML = `<div class="login-wrap"><div class="login-card"><h1>Reset admin password</h1><div class="sub">Enter the recovery code you saved during setup.</div><div class="form-group"><label class="form-label">Admin username</label><input class="form-input" id="rcUser"></div><div class="form-group"><label class="form-label">Recovery code</label><input class="form-input" id="rcCode" placeholder="XXXX-XXXX-XXXX" style="text-transform:uppercase"></div><div class="form-group"><label class="form-label">New password</label><input class="form-input" id="rcPw" type="password" autocomplete="new-password"></div><div id="rcErr" class="form-err"></div><button class="btn-primary" id="rcGo">Reset password</button><div class="login-link" id="rcBack">← Back to sign in</div></div></div>`;
  $('#rcBack').onclick = showLogin;
  $('#rcGo').onclick = () => {
    const u = findUser(val('rcUser')); const rc = db.meta.recovery; const err = m => $('#rcErr').textContent = m;
    if (Date.now() < _lockUntil) return err('Too many attempts — wait a moment.'); if (!u || u.role !== 'admin') { _fails++; return err('No active admin with that username.'); } if (!rc || rc.hash !== hashPw(val('rcCode').trim().toUpperCase(), rc.salt)) { _fails++; if (_fails >= 5) { _lockUntil = Date.now() + 30000; _fails = 0; } return err('Wrong recovery code.'); } if (val('rcPw').length < 6) return err('New password must be at least 6 characters.');
    u.salt = randSalt(); u.hash = hashPw(val('rcPw'), u.salt); currentUser = u; logAct('Password reset', 'Admin password reset with recovery code'); currentUser = null; save(); toast('Password reset — sign in now', 'ok'); showLogin();
  };
}

/* ----- app shell ----- */
function setupTopbar() {
  applyBranding(); const u = cu();
  $('#userChip').innerHTML = `${esc(u.name)}<small>${u.role}</small>`; updateBackupDot();
}
function startApp() {
  $('#auth').classList.add('hidden'); $('#auth').innerHTML = ''; $('#app').classList.remove('hidden');
  setupTopbar(); buildNav(); resetIdle(); go(isAdmin() ? 'dashboard' : (can('sell') ? 'pos' : 'dashboard'));
  if (isAdmin()) {
    const last = db.meta.lastAutoBackup; if (!last || Date.now() - new Date(last) > 6 * 3600e3) autoBackup('auto (sign-in)');
    if (db.settings.autoDownload && (!db.meta.lastFileBackup || isoToLocalDate(db.meta.lastFileBackup) !== today())) setTimeout(() => { if (currentUser) downloadBackup(true); }, 4000);
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
}
async function logout(auto) {
